# Imágenes Docker: en cada merge a main se construyen backend y frontend y se publican en
# GitHub Container Registry (ghcr.io), etiquetadas con el commit corto. El servidor solo
# las descarga: no compila nada. También se puede correr a mano para un commit dado.
name: Images

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: images-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # ghcr.io exige minúsculas en el nombre del repositorio.
  IMAGE_PREFIX: ghcr.io/vilchezfelipe8/pique

jobs:
  build:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: backend
            context: apps/backend
          - app: frontend
            context: apps/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Tag del commit
        id: tag
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64
          # Los valores públicos del frontend son fijos (mismos que docker-compose.production.yml).
          build-args: |
            NEXT_PUBLIC_API_URL=/api
            NEXT_PUBLIC_SITE_URL=https://pique.ar
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:${{ steps.tag.outputs.short }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Resumen
        run: |
          echo "### ${{ matrix.app }}" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:${{ steps.tag.outputs.short }}\`" >> "$GITHUB_STEP_SUMMARY"
