server {
  listen 80;
  server_name pique.ar www.pique.ar;
  server_tokens off;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Only ACME is public until a trusted TLS certificate has been issued.
  location / {
    return 503 "Pique: configurando servidor.\n";
    add_header Content-Type text/plain always;
  }
}
