server {
  listen 80;
  server_name pique.ar www.pique.ar;
  server_tokens off;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://pique.ar$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name www.pique.ar;
  ssl_certificate /etc/letsencrypt/live/pique.ar/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/pique.ar/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  server_tokens off;
  return 301 https://pique.ar$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name pique.ar;
  ssl_certificate /etc/letsencrypt/live/pique.ar/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/pique.ar/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  server_tokens off;
  client_max_body_size 10m;

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://frontend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
